name: CI

# Builds every push and PR on both platforms. The point is to catch a break in
# the packaging path before a tag is pushed, because a Release run that fails
# halfway leaves a tag with no assets attached to it.
#
# Tests run before packaging, in the same job, on purpose: a failing test
# blocks the artifact the same way a failed publish already does, rather than
# racing a separate job that might finish (and upload) first. develop is in
# the push trigger alongside main because that is where feature/ and bugfix/
# branches land first and sit for a while — untested until a release branch
# cuts, previously.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The three bespoke suites predate xUnit here and keep their own
      # contract: exit non-zero on failure, `dotnet run` rather than
      # `dotnet test`. Platform-neutral, so both legs run all three.
      - name: Unit tests (arrangement, glyph, transcript)
        run: |
          dotnet run --project tests/ArrangementTests -c Release
          dotnet run --project tests/GlyphTests -c Release
          dotnet run --project tests/TranscriptTests -c Release

      # Everything added after those three is xUnit, in tests/Tests.sln. Run
      # as separate `dotnet test` invocations rather than one pass over the
      # whole solution, so a red run in one attributes to a suite by its own
      # job-log section instead of one merged wall of output — this matters
      # most for the headless UI suite, which is the one most likely to be
      # flaky on a runner with no real display.
      #
      # Hook-script integration tests self-gate by OS: HookScriptShTests
      # needs bash (this leg, on macOS) and HookScriptPs1Tests needs pwsh
      # (the Windows leg) — the other half reports as Skipped rather than
      # silently not existing.
      - name: Unit tests (xUnit)
        run: dotnet test tests/UnitTests -c Release --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Integration tests (xUnit)
        run: dotnet test tests/IntegrationTests -c Release --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults

      # xUnit v3 now (see tests/UiTests/ClaudeBuddy.UiTests.csproj's own
      # comment for why), which drops the old VSTest-hosted `dotnet test`
      # path outright on the .NET 10 SDK — `--logger`/`--results-directory`
      # are silently ignored under Microsoft Testing Platform, so trx
      # generation moves to MTP's own `--report-xunit-trx` flag (passed after
      # `--`, straight to the test host) and lands at the fixed,
      # non-configurable `<project>/bin/<config>/<tfm>/<rid>/TestResults/`
      # rather than wherever `--results-directory` points — hence the copy
      # into the shared TestResults/ folder below, so the existing "Upload
      # test results" step still finds it alongside UnitTests'/
      # IntegrationTests' trx files.
      #
      # Retried, not run once: this suite and tests/UiScreenshots both moved
      # to Avalonia 12.1.1 specifically to reach AvaloniaUI/Avalonia#21269,
      # the upstream fix for the FontManager concurrency race that used to
      # make this step fail roughly 1 run in 6-8 on real Windows hardware
      # even with every mitigation tried at 11.3.x (never closing a headless
      # window, disabling xUnit's cross-collection parallelization, a
      # synchronous FontManager warm-up before any test runs). Confirmed
      # fixed locally on macOS — 5 fresh runs of this suite and 23 of
      # tests/UiScreenshots, 0 failures across all of them — but not yet
      # proven on this runner. The retry loop stays until that's confirmed
      # here too: a genuinely broken test fails identically on every
      # attempt, retried or not, so this can only mask a flake that no
      # longer exists, never a real regression.
      - name: UI tests (xUnit, headless)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            dotnet test tests/UiTests -c Release -- --report-xunit-trx --report-xunit-trx-filename=ui-tests.trx
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "UI tests failed on attempt $attempt of 3"
            if ($attempt -eq 3) {
              # Copy the report BEFORE giving up. It used to be copied only after
              # the loop succeeded, which meant a red run uploaded nothing and the
              # only thing in the log was a count — "Failed: 1, Passed: 596" with
              # no name. Working out which test that was, on a platform you are not
              # on, is not a thing anyone should have to guess at.
              New-Item -ItemType Directory -Force -Path TestResults | Out-Null
              Copy-Item "tests/UiTests/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-tests.trx" "TestResults/ui-tests.trx" -ErrorAction SilentlyContinue
              exit 1
            }
          }
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          Copy-Item "tests/UiTests/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-tests.trx" "TestResults/ui-tests.trx"

      # Gated now, not a proof of concept: this started as a 2-screenshot POC
      # with continue-on-error, scaled up to one capture per tests/UiTests
      # scenario (30 total) once the POC proved out. It turns on real Skia
      # rendering — a heavier, different code path from the null renderer
      # the suite above uses — which is exactly what made it hit the
      # FontManager race far harder than that suite ever did; the Avalonia
      # 12.1.1 bump this project and the app both took (see this project's
      # own csproj comment) was specifically to fix that race, not just
      # paper over it. Same trx/copy dance as UI tests above, same retry
      # loop for the same not-yet-Windows-CI-proven reason.
      - name: UI screenshots
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            dotnet test tests/UiScreenshots -c Release -- --report-xunit-trx --report-xunit-trx-filename=ui-screenshots.trx
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "UI screenshots failed on attempt $attempt of 3"
            if ($attempt -eq 3) {
              # Copy the report BEFORE giving up. It used to be copied only after
              # the loop succeeded, which meant a red run uploaded nothing and the
              # only thing in the log was a count — "Failed: 1, Passed: 596" with
              # no name. Working out which test that was, on a platform you are not
              # on, is not a thing anyone should have to guess at.
              New-Item -ItemType Directory -Force -Path TestResults | Out-Null
              Copy-Item "tests/UiScreenshots/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-screenshots.trx" "TestResults/ui-screenshots.trx" -ErrorAction SilentlyContinue
              exit 1
            }
          }
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          Copy-Item "tests/UiScreenshots/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-screenshots.trx" "TestResults/ui-screenshots.trx"

      # Uploaded as a plain artifact here, not pushed anywhere — this job's
      # GITHUB_TOKEN is deliberately read-only whenever the run was
      # triggered by a pull_request from a fork (GitHub enforces this on
      # every public repo; no `permissions:` block can override it), and
      # this repo's PRs are exactly that. publish-screenshots.yml is a
      # separate workflow, triggered by workflow_run once this one
      # finishes, specifically because that trigger DOES get a real token
      # even for fork-originated runs — it never checks out or executes
      # anything from the fork itself, only downloads what already got
      # built here. (A workflow_run job listing this same workflow by name
      # cannot live in this file: GitHub rejects a workflow that lists
      # itself as its own workflow_run trigger — "cannot listen to itself"
      # — hence the separate file rather than a second job here.)
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ matrix.rid }}
          path: TestResults/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults/*.trx
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: dotnet publish ClaudeBuddy.csproj -c Release -r ${{ matrix.rid }} -p:DebugType=none --nologo

      # Packaging is where the fiddly, platform-specific work lives (inside-out
      # codesigning, Inno Setup), so exercise it here rather than discovering a
      # break during a release. Signing and notarization are skipped: no secrets
      # are exposed to pull requests.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./tools/build-macos-dmg.sh --rid ${{ matrix.rid }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: .\tools\build-windows-installer.ps1 -SkipPublish
        shell: pwsh

      # Not attached to a release, just kept so a failed build can be inspected
      # and so the installer can be smoke-tested from a PR.
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.rid }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
