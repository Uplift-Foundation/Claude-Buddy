name: Publish screenshots

# Separate from ci.yml on purpose, not by choice — GitHub rejects a workflow
# that lists itself as its own workflow_run trigger ("Workflow 'CI' cannot
# listen to itself", found by pushing exactly that and watching CI fail
# instantly), so a job that needs to react to CI finishing can't live in
# ci.yml alongside it.
#
# workflow_run is the trigger, specifically because it gets a real,
# write-capable GITHUB_TOKEN even when the run that finished was a
# pull_request from a fork — every PR this repo gets. A pull_request run's
# own token is always read-only on a public repo, no `permissions:` block
# overrides that, and ci.yml's build job can only upload the captured PNGs
# as a plain artifact as a result (see its "Upload screenshots" step). This
# workflow never checks out or executes anything from the commit that
# triggered ci.yml — it only downloads artifacts that untrusted run already
# produced, then pushes those (never fork-controlled code) to a dedicated
# branch and comments on the PR with real, renderable image URLs.
#
# (GitHub strips data: URIs from <img src> in both job summaries and PR
# comments — confirmed by trying it, not assumed — so an actually-visible
# screenshot needs a real HTTPS URL. A dedicated "screenshots" branch is
# still the established, dependency-free place to put the PNGs; real
# projects use exactly this pattern, e.g. a screenshot-history blog workflow
# and a "screenshots" branch in openpilot's own UI test PRs.)
#
# CB-118: the image URL itself has to be a github.com one, not
# raw.githubusercontent.com. That second domain doesn't see the viewer's
# github.com session cookie at all — it's a separate origin — so for a
# private repo it 404s for every human reading the PR in a browser, even
# one with full read access, while an authenticated `curl`/`gh api` call
# still succeeds (this is exactly what made the bug invisible to an agent
# testing it, and what CB-118's repro caught with plain curl). github.com's
# own `/<owner>/<repo>/raw/<branch>/<path>` endpoint is the fix: it's
# same-origin with the PR comment page, so the browser's session cookie is
# sent, and GitHub 302s it to a raw.githubusercontent.com URL carrying a
# short-lived signed `?token=` — freshly minted on every load, which is
# exactly why this works from a persistent PR-comment link where a
# hand-copied `?token=` URL would eventually expire. Confirmed locally
# (this repo happens to be public again at the time of this fix, so this
# was the reachable half of the test): an unauthenticated `curl -L` against
# `github.com/.../raw/refs/heads/screenshots/win-x64/<file>.png` returns
# 200, redirecting through exactly that signed raw.githubusercontent.com
# URL. The private-repo half — that the same request 404s without a
# session and 200s with one — was not re-verified against a real private
# instance of this repo (flipping visibility to test would affect every
# other agent and PR using it); it rests on GitHub's own documented
# behavior of serving that endpoint's redirect off the request's session,
# which is also how "View raw" from the private-repo blob UI has always
# worked. If this repo goes private again and a comment image still 404s,
# start here rather than re-deriving it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # workflow_run only ever fires using the copy of THIS file already on the
  # repo's default branch (main) — confirmed before relying on it, since a
  # trigger that silently never fires until some later release is a bad
  # thing to discover after merging. Kept now that this file has reached
  # main and workflow_run is confirmed firing for real (three runs, all
  # succeeded, pushing real content to the screenshots branch): still
  # useful for re-testing the download/push sequence against a specific
  # past run without waiting for a new CI run to complete.
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run ID to pull screenshot artifacts from"
        required: true
      pr_number:
        description: "PR number to comment on (optional)"
        required: false

jobs:
  publish-screenshots:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write

    steps:
      # merge-multiple: false (the default) keeps each matrix leg's PNGs in
      # their own ui-screenshots-<rid>/ subdirectory — the directory name
      # is what tells the push step below which rid a given image is from.
      - name: Download screenshot artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ui-screenshots-*
          path: downloaded
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}

      # Same clone/orphan/commit/push shape verified locally against a
      # throwaway git remote before trusting it here (two simultaneous
      # pushes, both survived via fetch+rebase+retry) — kept even though
      # there's only one job doing the pushing, since two workflow_run
      # events close together (e.g. two quick pushes to develop) could
      # still race on the same branch.
      - name: Publish to the screenshots branch and comment on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          repo="${{ github.repository }}"
          branch="screenshots"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
          # Absolute, deliberately: everything below cd's into a sibling
          # clone directory, and a relative "../downloaded" would then
          # resolve against THAT directory's parent, not the workspace
          # this script actually started in — a real bug this exact test
          # caught locally (a bash -x trace showed the push step never
          # even running because the loop that populates $rid/*.png found
          # nothing to copy).
          downloaded_abs="$(pwd)/downloaded"
          clone_path="../screenshots-branch"

          pngs_found=0
          for dir in "$downloaded_abs"/ui-screenshots-*/; do
            [ -d "$dir" ] || continue
            [ -n "$(find "$dir" -maxdepth 1 -name '*.png' -print -quit)" ] && pngs_found=1
          done

          summary="## UI screenshots"$'\n\n'
          if [ "$pngs_found" -eq 0 ]; then
            summary+="_No screenshots were produced this run._"$'\n'
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          rm -rf "$clone_path"
          if ! git clone --quiet --depth 1 --branch "$branch" "$remote_url" "$clone_path" 2>/dev/null; then
            git clone --quiet --depth 1 "$remote_url" "$clone_path"
            (cd "$clone_path" && git checkout --quiet --orphan "$branch" && git rm --quiet -rf . 2>/dev/null || true)
          fi

          cd "$clone_path"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for dir in "$downloaded_abs"/ui-screenshots-*/; do
            [ -d "$dir" ] || continue
            rid="$(basename "$dir" | sed 's/^ui-screenshots-//')"
            mkdir -p "$rid"
            cp "$dir"*.png "$rid/" 2>/dev/null || true
          done

          git add -A
          pushed=1
          if [ -n "$(git status --porcelain)" ]; then
            git commit --quiet -m "Screenshots from run ${{ github.event.inputs.run_id || github.event.workflow_run.id }}"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push --quiet origin "HEAD:$branch" 2>/dev/null; then
                pushed=1
                break
              fi
              echo "Push conflict, retry $attempt of 5"
              git fetch --quiet origin "$branch"
              git rebase --quiet "origin/$branch"
            done
          fi
          cd -

          if [ "$pushed" -ne 1 ]; then
            summary+="_Captured screenshots but could not publish them (push kept conflicting)._"$'\n'
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body="$summary"
          for dir in "$downloaded_abs"/ui-screenshots-*/; do
            [ -d "$dir" ] || continue
            rid="$(basename "$dir" | sed 's/^ui-screenshots-//')"
            for file in "$dir"*.png; do
              [ -e "$file" ] || continue
              name="$(basename "$file" .png)"
              raw_url="https://github.com/${repo}/raw/refs/heads/${branch}/${rid}/$(basename "$file")"
              body+="**${name} (${rid})**"$'\n\n'
              body+="![${name}](${raw_url})"$'\n\n'
            done
          done

          echo "$body" >> "$GITHUB_STEP_SUMMARY"

          # workflow_run.pull_requests comes back completely empty
          # specifically when the triggering run was a pull_request from a
          # fork — a documented GitHub limitation (github/community#170144),
          # not a bug here — and every PR this repo gets is from a fork.
          # Relying on it alone would mean this comment step silently never
          # fires for the one case it exists for. Fall back to searching by
          # head branch + fork owner, both of which ARE present on the
          # workflow_run event regardless of fork origin.
          #
          # That fallback used to be a REST `pulls?head=owner:branch` call,
          # and it never matched a single fork PR (CB-117): reproduced by
          # hand against the live API on PRs #163-165, any `head` value
          # containing a colon comes back empty, and the colon is mandatory
          # to scope the match to one owner. `state=all` and percent-encoding
          # the colon didn't help either — this is the REST endpoint simply
          # not resolving a fork owner, not a formatting mistake. `gh pr
          # list`, which goes through GraphQL, resolves the same fork heads
          # correctly (verified live: matched #164 for
          # wtvamp:bugfix/usage-orb-inherits-config-dir and #163 for
          # wtvamp:feature/agent-notes-read-code-from-a-pinned-ref, and
          # returned nothing for the same branch under a wrong owner — see
          # CB-117 for the full table). `gh pr list --head` only matches on
          # branch name, so the owner is re-applied with a `select` on
          # `headRepositoryOwner.login`; dropping it would let two forks
          # that happen to push the same branch name collide on `[0]`.
          #
          # A manual workflow_dispatch run skips all of that and just uses
          # whatever PR number was passed in, if any.
          pr_number="${{ github.event.inputs.pr_number }}"
          if [ -z "$pr_number" ]; then
            pr_number="${{ github.event.workflow_run.pull_requests[0].number }}"
          fi
          head_owner="${{ github.event.workflow_run.head_repository.owner.login }}"
          head_branch="${{ github.event.workflow_run.head_branch }}"
          if [ -z "$pr_number" ] && [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            if [ -n "$head_owner" ] && [ -n "$head_branch" ]; then
              pr_number="$(gh pr list --repo "$repo" --head "$head_branch" --state open \
                --json number,headRepositoryOwner \
                --jq "[.[] | select(.headRepositoryOwner.login==\"$head_owner\")][0].number // empty")"
            fi
          fi

          # A no-match used to be indistinguishable from a successful
          # comment — this is the whole reason CB-117 went unnoticed across
          # three PRs. Log the resolution unconditionally, and when a
          # pull_request run genuinely expected a PR and didn't find one,
          # say so in the step summary rather than exiting quietly: a run
          # that published images and told nobody should not look like one
          # that commented. A workflow_run from a push to main/develop
          # legitimately has no PR, so only the pull_request case is worth
          # flagging as a miss.
          echo "resolved pr_number='${pr_number}' (event=${{ github.event.workflow_run.event }}, head=${head_owner}:${head_branch})"

          if [ -n "$pr_number" ]; then
            echo "$body" | gh pr comment "$pr_number" --repo "$repo" --body-file -
          elif [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            {
              echo "_Screenshots published to the branch, but no open PR was found for ${head_owner}:${head_branch} — the comment was not posted._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
